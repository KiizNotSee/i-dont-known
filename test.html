<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Trang Link-in-Bio cá nhân — Kết nối với mình qua TikTok, Facebook, GitHub và Telegram." />
  <title>Nguyễn Văn A — Link in Bio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Nền đốm sáng blur -->
  <div class="bg" aria-hidden="true">
    <span class="blob blob--violet"></span>
    <span class="blob blob--cyan"></span>
    <span class="blob blob--pink"></span>
  </div>

  <!-- Card kính mờ trung tâm -->

    <header class="profile">
      <div class="avatar-wrap">
        <img
          class="avatar"
          src="https://i.pravatar.cc/300?img=12"
          alt="Ảnh đại diện của Nguyễn Văn A"
          loading="eager"
          decoding="async"
        />
      </div>
      <h1 class="name">Nguyễn Văn A</h1>
      <p class="bio">Frontend Developer · Đam mê UI/UX &amp; thiết kế tối giản ✨</p>
    </header>

    <nav class="links" aria-label="Liên kết mạng xã hội">

      <a class="link link--tiktok" href="https://www.tiktok.com/@username" target="_blank" rel="noopener noreferrer">

          </svg>
        </span>
        <span class="link-text">
          <span class="link-title">TikTok</span>
          <span class="link-sub">@username</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </a>

      <a class="link link--facebook" href="https://facebook.com/username" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </span>
        <span class="link-text">
          <span class="link-title">Facebook</span>
          <span class="link-sub">Nguyễn Văn A</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </a>

      <a class="link link--github" href="https://github.com/username" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

          </svg>
        </span>
        <span class="link-text">
          <span class="link-title">GitHub</span>
          <span class="link-sub">github.com/username</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </a>

      <a class="link link--telegram" href="https://t.me/username" target="_blank" rel="noopener noreferrer">

            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
        </span>
        <span class="link-text">
          <span class="link-title">Telegram</span>
          <span class="link-sub">@username</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </a>

    </nav>

    <footer class="footer">
      © 2025 Nguyễn Văn A · Made with <span class="heart">♥</span>
    </footer>

  </main>

  <script>
    // Hiệu ứng quầng sáng bám theo con trỏ (tự động bỏ qua trên thiết bị cảm ứng)
    (function () {
      const card = document.querySelector('.card');
      if (!card || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

      card.addEventListener('pointermove', function (e) {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
        card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
      });
    })();
  </script>

</body>
</html>
