<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0c10">
<title>Map Roulette | VALORANT</title>
<style>
:root{color-scheme:dark;--bg:#090a0e;--panel:#14161d;--line:#343039;--red:#ff4655;--muted:#9a9ba5;--text:#f4f4f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#392027 0,transparent 42%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,760px)}.top{text-align:center;margin-bottom:26px}.eyebrow{color:var(--red);font-size:.76rem;letter-spacing:.24em;font-weight:800}.top h1{font-size:clamp(2rem,7vw,3.4rem);letter-spacing:-.06em;margin:8px 0}.top p{color:var(--muted);margin:0}
.panel{background:linear-gradient(145deg,#191b23,#101116);border:1px solid #493039;border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 22px 70px #0008}
.result-wrap{min-height:245px;display:grid;place-items:center;text-align:center;border:1px solid #ffffff12;border-radius:17px;background:radial-gradient(ellipse at center,#42232b55,transparent 68%),#0c0d12;padding:25px;margin-bottom:22px;position:relative;overflow:hidden}
.result-wrap:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff08 50%,transparent 65%);transform:translateX(-100%);pointer-events:none}
.result-wrap.spinning:before{animation:shine .6s linear infinite}
@keyframes shine{to{transform:translateX(100%)}}
.result-label{font-size:.72rem;letter-spacing:.2em;color:var(--muted);font-weight:800}.map-name{font-size:clamp(2.7rem,10vw,5rem);font-weight:950;letter-spacing:-.07em;margin:8px 0 2px;text-transform:uppercase}.sub{color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:14px 22px;font-weight:850;font-size:.95rem;cursor:pointer;transition:transform .15s,filter .15s}
button:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--red);color:white;box-shadow:0 8px 24px #ff465533}.secondary{background:#292b34;color:#eee;border:1px solid #ffffff18}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 13px}.section-head h2{font-size:1rem;margin:0}.count{color:var(--muted);font-size:.82rem}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.map{border:1px solid #ffffff18;background:#20222b;border-radius:13px;padding:13px;text-align:left;color:var(--text);display:flex;align-items:center;gap:10px;min-height:62px;cursor:pointer}
.map .dot{width:10px;height:10px;border-radius:3px;background:var(--red);box-shadow:0 0 13px #ff465577;flex:none}.map.off{opacity:.36;filter:grayscale(1);text-decoration:line-through}.map:focus-visible,button:focus-visible{outline:2px solid white;outline-offset:3px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}.hint{font-size:.8rem;color:var(--muted)}
.history{display:flex;flex-wrap:wrap;gap:8px;min-height:34px}.chip{padding:7px 10px;background:#242630;border:1px solid #ffffff12;border-radius:99px;font-size:.8rem;color:#d8d8de}
.footer{text-align:center;color:#696b76;font-size:.75rem;margin-top:18px}
@media(max-width:430px){body{padding:15px}.result-wrap{min-height:210px}.maps{grid-template-columns:repeat(2,minmax(0,1fr))}.actions button{flex:1}}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="eyebrow">VALORANT • RANDOMIZER</div>
    <h1>MAP ROULETTE</h1>
    <p>Để định mệnh chọn map cho trận tiếp theo.</p>
  </header>
  <section class="panel">
    <div class="result-wrap" id="resultBox" aria-live="polite">
      <div>
        <div class="result-label" id="resultLabel">READY?</div>
        <div class="map-name" id="result">---</div>
        <div class="sub" id="sub">Nhấn nút bên dưới để quay map</div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="spin">🎲 RANDOM MAP</button>
      <button class="secondary" id="reset">↻ Đặt lại</button>
    </div>
    <div class="section-head">
      <h2>POOL MAP</h2><span class="count" id="count">7 / 7 map đang bật</span>
    </div>
    <div class="maps" id="maps"></div>
    <div class="controls">
      <span class="hint">Chạm vào map để bật / tắt khỏi vòng quay.</span>
      <button class="secondary" id="toggleAll">Tắt tất cả</button>
    </div>
    <div class="section-head">
      <h2>LỊCH SỬ GẦN ĐÂY</h2><span class="count">Tối đa 5 lượt</span>
    </div>
    <div class="history" id="history"><span class="hint">Chưa có lượt quay nào.</span></div>
  </section>
  <div class="footer">Fan-made randomizer • Không liên kết với Riot Games</div>
</main>
<script>
const allMaps=["Bind","Abyss","Lotus","Sunset","Haven","Corrode","Summit"];
let enabled=new Set(allMaps),history=[],lastMap=null,busy=false;
const $=id=>document.getElementById(id);
function renderMaps(){
  $("maps").innerHTML="";
  allMaps.forEach(name=>{
    const b=document.createElement("button");
    b.className="map"+(enabled.has(name)?"":" off");
    b.setAttribute("aria-pressed",String(enabled.has(name)));
    b.innerHTML='<span class="dot"></span><strong>'+name+'</strong>';
    b.addEventListener("click",()=>{if(enabled.has(name))enabled.delete(name);else enabled.add(name);renderMaps()});
    $("maps").appendChild(b);
  });
  $("count").textContent=enabled.size+" / "+allMaps.length+" map đang bật";
  $("toggleAll").textContent=enabled.size===allMaps.length?"Tắt tất cả":"Bật tất cả";
  $("spin").disabled=enabled.size===0||busy;
}
function renderHistory(){
  $("history").innerHTML=history.length?history.map((m,i)=>'<span class="chip">'+(i+1)+'. '+m+'</span>').join(""):'<span class="hint">Chưa có lượt quay nào.</span>';
}
function pick(){
  const pool=[...enabled].filter(m=>m!==lastMap);
  const choices=pool.length?pool:[...enabled];
  return choices[Math.floor(Math.random()*choices.length)];
}
function spin(){
  if(busy||!enabled.size)return;
  busy=true;renderMaps();
  const box=$("resultBox"),label=$("resultLabel"),result=$("result"),sub=$("sub");
  box.classList.add("spinning");label.textContent="ĐANG QUAY...";sub.textContent="Map nào sẽ lên bảng?";
  let ticks=0;
  const timer=setInterval(()=>{
    result.textContent=[...enabled][Math.floor(Math.random()*enabled.size)].toUpperCase();
    ticks++;
    if(ticks>=15){
      clearInterval(timer);
      const winner=pick();lastMap=winner;result.textContent=winner.toUpperCase();
      label.textContent="MAP ĐƯỢC CHỌN";sub.textContent="GLHF! Chúc trận này leo rank mượt.";
      box.classList.remove("spinning");
      history.unshift(winner);history=history.slice(0,5);renderHistory();
      busy=false;renderMaps();
    }
  },85);
}
$("spin").addEventListener("click",spin);
$("reset").addEventListener("click",()=>{
  enabled=new Set(allMaps);history=[];lastMap=null;
  $("resultLabel").textContent="READY?";$("result").textContent="---";$("sub").textContent="Nhấn nút bên dưới để quay map";
  $("resultBox").classList.remove("spinning");renderMaps();renderHistory();
});
$("toggleAll").addEventListener("click",()=>{
  enabled=enabled.size===allMaps.length?new Set():new Set(allMaps);
  renderMaps();
});
renderMaps();renderHistory();
</script>
</body>
</html>
